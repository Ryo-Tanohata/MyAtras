name: Publish site

# Serves dist/ on GitHub Pages on every push, and fetches observations only when
# started by hand. A GitHub runner can reach SSEC, which neither the agent containers
# nor a phone can, so this is where a refresh happens - but a day of observations is
# a full turn of the Earth, which is what the globe set out to show, so it is not
# refreshed on a schedule.
#
# A fetch publishes what it downloaded without committing it, unless `commit` is
# asked for: three days of hourly frames with their winds and motion are about 19 MB
# and images do not diff, so keeping
# every refresh would dwarf a repository whose source is a few megabytes. `commit`
# makes the fetched set the bundled one, which is how the site keeps showing a
# refresh once the run is over. Either way records/published-observations.json says
# what was published, with the SHA-256 and source URL of each frame.
#
# dist/weather/ is what a push publishes: the copy that works offline, that a fresh
# clone can check, and that is published when a fetch cannot be made.
#
# `region` has to be asked for as well, because a fetch without it clears the close-up:
# a crop belongs to the observations it was cut from, so the script empties the directory
# rather than leave frames from hours that are no longer bundled. Left out of a dispatch,
# this workflow would publish a site whose close-up switch has nothing behind it.
#
# `wind_every` is what keeps a refresh off SSEC's back. The images are light - a full
# set is about 19 MB over 85 requests - but one hour of wind is a 19.9 MB answer for
# AMV-LLlow plus 3.3 MB for AMV-LLmid, so asking at every hour of a three-day set
# downloads about 1.6 GB to keep 3.2 MB of one-degree grids. The wind is only the
# second source for the model between observations, behind the motion measured from
# the images themselves, so this asks every six hours by default - about 280 MB - and
# leaves the hours in between to that motion. Empty the field to ask at every hour.
#
# The standalone single-file build is produced here rather than committed, so the
# published copy is always rebuilt from the same observations the site serves.
#
# The Japan Meteorological Agency's typhoon forecast goes with the observations: the one
# issued when they end, which is where the simulation starts. It is fetched when the
# observations change - fetched ones, or bundled ones the committed forecast was not
# chosen for - and kept with them: committed with a `commit` fetch, and on its own when
# it was fetched for the bundled set. There is no schedule. Fetching the newest forecast
# every three hours, as this first did, replaced the one that fitted the observations
# with ones that no longer did, and the storm stopped following the agency.

on:
  push:
    branches: [main]
    # The record this workflow writes must not start it again.
    paths-ignore: ['records/**']
  # No schedule. A day of observations is a full turn of the Earth, which is what this
  # set out to show, so it is fetched when someone asks for it rather than every
  # morning for ever; the typhoon forecast goes with it (see above).
  workflow_dispatch:
    inputs:
      fetch:
        description: 'Fetch the newest observations from SSEC'
        type: boolean
        default: true
      frames:
        description: 'How many observations to publish'
        default: '72'
      every:
        description: 'Minutes between them'
        default: '60'
      span:
        description: 'Hours back SSEC is asked to list (it keeps about a week of images, three days of wind)'
        default: '72'
      winds:
        description: 'Also store the observed wind at each observation time, for the Unity model'
        type: boolean
        default: true
      wind_every:
        description: 'Minutes between the hours the wind is asked for (360 asks a sixth as often; empty asks at every observation, about 1.6 GB)'
        default: '360'
      region:
        description: 'Also cut the close-up over Japan, which the page offers zoomed in'
        type: boolean
        default: true
      commit:
        description: 'Commit the fetched observations, making them the bundled set'
        type: boolean
        default: false
      jma_charts_again:
        description: "Fetch the agency's surface charts (fronts) again for the bundled observations; the typhoon forecast is left as committed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Against the bundled observations, before they are replaced: a failure here is
      # about the code, not about what SSEC served this morning.
      - name: Test suites
        run: |
          for suite in tests/*.test.cjs; do
            echo "--- $suite"
            node "$suite" || exit 1
          done

      # Only when asked, and best effort even then. SSEC being unreachable, or
      # serving an observation under a time it will not confirm, must not take the
      # site down: the bundled observations are published instead and the step says
      # so. A push publishes what is committed, without touching the network.
      - name: Fetch the newest observations
        id: fetch
        if: inputs.fetch
        continue-on-error: true
        run: |
          node scripts/fetch-observations.cjs \
            --frames "${{ inputs.frames || '72' }}" \
            --every "${{ inputs.every || '60' }}" \
            --span "${{ inputs.span || '72' }}" \
            ${{ inputs.winds && '--winds' || '' }} \
            ${{ inputs.wind_every && format('--wind-every {0}', inputs.wind_every) || '' }} \
            ${{ inputs.region && '--region' || '' }} | tee fetch.log

      - name: Say which observations are being published
        run: |
          if [ "${{ steps.fetch.outcome }}" = "skipped" ]; then
            echo "Publishing the observations bundled in the repository." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.fetch.outcome }}" = "success" ]; then
            echo "Publishing the observations fetched just now." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SSEC could not be reached; publishing the bundled observations." >> "$GITHUB_STEP_SUMMARY"
            # A run that failed part way may have left frames behind that no manifest
            # names; restore the bundled set exactly.
            git checkout -- dist/weather dist/data
            git clean -fd dist/weather dist/data
          fi
          node -e '
            const m = require("./dist/weather/sequence/manifest.json").globalir;
            console.log(`${m.length} frames, ${m[0].time} to ${m.at(-1).time}`);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      # After the step above, which can put dist/data back as committed. Only when the
      # observations are not the ones the committed forecast was chosen for. Best effort:
      # a failure leaves a file with no storms, and the simulation moves no storm.
      - name: Fetch the Japan Meteorological Agency's typhoon forecast for the observations
        id: jma
        continue-on-error: true
        run: |
          WANT="$(node -p 'require("./dist/weather/sequence/manifest.json").globalir.at(-1).time')"
          HAVE="$(node -p 'require("./dist/data/jma-typhoon.json").for || ""')"
          if [ "$WANT" = "$HAVE" ]; then
            echo "The committed forecast was chosen for $WANT; not fetched again." | tee jma.log
            echo "fetched=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/fetch-jma-typhoon.cjs --dump | tee jma.log
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi

      # The agency's surface charts, for the fronts on them, go with the observations the
      # same way: the analysis and the 24 and 48 hour forecasts from the initial time
      # nearest the last observation, a few small files, fetched only when the committed
      # ones were chosen for other observations (or asked for again). Best effort.
      - name: Fetch the Japan Meteorological Agency's surface charts for the observations
        id: jmafronts
        continue-on-error: true
        run: |
          WANT="$(node -p 'require("./dist/weather/sequence/manifest.json").globalir.at(-1).time')"
          HAVE="$(node -p 'try { require("./dist/data/jma-fronts.json").for || "" } catch (e) { "" }')"
          if [ "$WANT" = "$HAVE" ] && [ "${{ inputs.jma_charts_again }}" != "true" ]; then
            echo "The committed charts were chosen for $WANT; not fetched again." | tee jma-fronts.log
            echo "fetched=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/fetch-jma-fronts.cjs --dump | tee jma-fronts.log
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi

      # The measured motion belongs to the observations it was measured from, so it is
      # rebuilt whenever they are replaced. No network: scripts/build-motion.cjs reads
      # only the frames just fetched. A test holds each field to its two frames.
      - name: Measure the cloud motion between the fetched observations
        if: steps.fetch.outcome == 'success'
        run: node scripts/build-motion.cjs

      # Likewise: a storm belongs to the observations it was found in, and a test refuses
      # storms.json if it names frames that are no longer bundled. Also no network.
      - name: Find the storms in the fetched observations
        if: steps.fetch.outcome == 'success'
        run: node scripts/find-storms.cjs

      # The suites ran above against the bundled observations; this runs them against
      # the ones just fetched, before anything is published or committed. A fetched set
      # the suites reject is neither - the first `commit` run bundled 24 observations
      # that four playback tests, written for thirteen, then failed on.
      - name: Test suites against the fetched observations
        if: steps.fetch.outcome == 'success'
        run: |
          for suite in tests/*.test.cjs; do
            echo "--- $suite"
            node "$suite" || exit 1
          done

      # Re-checks every frame against the SHA-256 recorded for it and fails the build
      # on a mismatch, so a frame that arrived corrupted never reaches the site.
      - name: Build the standalone export
        run: python scripts/export-html.py

      - name: Find the browser on the runner
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium or Chrome on this runner image." >&2
            exit 1
          fi
          echo "CHROMIUM=$CHROME" >> "$GITHUB_ENV"

      # What is about to be published is opened and looked at first: a globe that
      # stopped drawing, or a frame that will not load, fails here rather than on
      # someone's phone.
      - name: The site plays the observations it is about to publish
        run: node tools/check-webgl.cjs --shots

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Record what was published
        if: steps.fetch.outcome == 'success'
        env:
          COMMIT_OBSERVATIONS: ${{ inputs.commit }}
        run: |
          # Traced, because a step that quietly decides there is nothing to record
          # looks exactly like one that recorded something.
          set -x
          mkdir -p records
          node -e '
            const fs = require("fs");
            const frames = JSON.parse(fs.readFileSync("dist/weather/sequence/manifest.json", "utf8")).globalir;
            const snapshot = JSON.parse(fs.readFileSync("dist/weather/snapshot.json", "utf8"));
            fs.writeFileSync("records/published-observations.json", JSON.stringify({
              published: new Date().toISOString(),
              run: process.env.GITHUB_RUN_ID,
              first: frames[0].time,
              last: frames.at(-1).time,
              count: frames.length,
              megabytes: +(frames.reduce((s, f) => s + f.bytes, 0) / 1048576).toFixed(2),
              frames: frames.map(f => ({ time: f.time, sha256: f.sha256, source: f.source })),
              snapshot: Object.fromEntries(Object.entries(snapshot)
                .map(([k, v]) => [k, { time: v.time, sha256: v.sha256 }])),
            }, null, 1) + "\n");
          '

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ls -l records/
          git add -f records/published-observations.json
          # Asked for explicitly: the fetched frames become the bundled set, so the
          # site keeps showing them when nothing is fetching any more. About 5 MB,
          # which is why it is not what a fetch does by default.
          if [ "$COMMIT_OBSERVATIONS" = "true" ]; then
            git add -A dist/weather dist/data
          fi
          git status --short
          if git diff --cached --quiet; then
            echo "::warning::Nothing staged for the record, which should not happen."
            exit 0
          fi
          if [ "$COMMIT_OBSERVATIONS" = "true" ]; then
            git commit -m "Bundle the observations published on $(date -u +%Y-%m-%d)"
          else
            git commit -m "Record the observations published on $(date -u +%Y-%m-%d)"
          fi
          # Someone may have pushed while this ran. The record is not worth failing a
          # publish that already succeeded, so try once and say plainly if it fails.
          if git pull --rebase origin main && git push origin HEAD:main; then
            echo "Recorded."
          else
            echo "::warning::Could not push the record; the publish itself succeeded."
          fi

      # The forecast fetched for the bundled observations - on a push after they were
      # committed, say - is kept with them, so the next publish need not find it again:
      # the agency's feed holds only a few days of reports.
      - name: Keep the typhoon forecast and surface charts with the bundled observations
        if: steps.fetch.outcome != 'success' && (steps.jma.outputs.fetched == 'true' || steps.jmafronts.outputs.fetched == 'true')
        run: |
          set -x
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/jma-typhoon.json
          [ -f dist/data/jma-fronts.json ] && git add dist/data/jma-fronts.json
          if git diff --cached --quiet; then exit 0; fi
          FOR="$(node -p 'require("./dist/data/jma-typhoon.json").for')"
          git commit -m "Keep the agency's typhoon forecast and surface charts for the observations ending $FOR"
          if git pull --rebase origin main && git push origin HEAD:main; then
            echo "Kept."
          else
            echo "::warning::Could not push the forecast; the publish itself succeeded."
          fi

      - name: Keep the screenshots and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-observations
          path: |
            .check-shots/
            fetch.log
            jma.log
            jma-fronts.log
            dist/data/jma-typhoon.json
            dist/data/jma-fronts.json
            records/published-observations.json
          # .check-shots starts with a dot, and the upload skips hidden files unless
          # told otherwise - which is why the first run's artifact held no screenshots.
          include-hidden-files: true
          if-no-files-found: ignore
